[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mx5-update"
version = "0.1.0"
description = "Native Linux firmware updater for the HeadRush MX5"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
mx5-update = "mx5_update.cli:main"

[tool.setuptools.packages.find]
include = ["mx5_update*"]
