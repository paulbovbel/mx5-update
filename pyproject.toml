[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mx5-update"
version = "0.1.0"
description = "Validated firmware extraction and Fastboot flashing tools for the HeadRush MX5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.urls]
Repository = "https://github.com/paulbovbel/mx5-update"
Documentation = "https://github.com/paulbovbel/mx5-update#readme"

[project.scripts]
mx5-extract-firmware = "mx5_update.extract:main"

[tool.setuptools.packages.find]
include = ["mx5_update*"]

[tool.setuptools]
script-files = ["scripts/mx5-flash"]
